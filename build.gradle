plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ksh'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    querydslVersion = '5.1.0'
    lombokVersion = '1.18.34'
    redissonVersion = '3.46.0'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    //Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    //QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    implementation "com.querydsl:querydsl-sql-spatial:${querydslVersion}"
    implementation "com.querydsl:querydsl-spatial:${querydslVersion}"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"

    //H2
    runtimeOnly 'com.h2database:h2'

    //Redis
    implementation "org.redisson:redisson-spring-boot-starter:${redissonVersion}"

    //Jakarta API
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    //Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.jmock:jmock:2.12.0'

    //MySQL
    implementation 'com.mysql:mysql-connector-j'

    //JPA
    implementation 'org.hibernate.orm:hibernate-spatial:6.6.13.Final'
    implementation "org.locationtech.jts:jts-core:1.19.0"
}

tasks.named('test') {
    useJUnitPlatform()
}
